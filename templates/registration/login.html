{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('{% static "images/OIP.jpeg" %}');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            min-height: 100vh;
        }        

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        form {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            font-weight: bold;
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }

        form button {
            margin-top: 20px;
        }

        form a {
            display: inline-block;
            margin-top: 10px;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container mt-5">
  <form method="post">
    {% csrf_token %}
    <h2>Login</h2>
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary w-100">Login</button>
    <a href="{% url 'home' %}" class="btn btn-secondary w-100 mt-3">Back</a>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
